# Main class, must match your JavaPlugin class (package + class name)
main: com.sklambda.SkLambda
# Minimum Bukkit API version your addon supports
api-version: 1.21
# Plugin name, shown in /plugins
name: skLambda
authors: ['Ahmad Saleem']
description: Adds first-class lambdas to Skript.
# @version@ is replaced with the actual version from build.gradle during build
version: @version@
website: https://github.com/ahmadmsaleem/skLambda
# softdepend = optional dependency (won't crash if missing, but loads after these plugins)
# depend = required dependency (server won't start without it)
# Skript should be softdepend because we handle the missing check ourselves in onEnable()
# skript-gui too: the gui module checks for it at enable time, so we have to load after it
softdepend: [Skript, skript-gui]

commands:
  sklambda:
    description: Shows the skLambda version/link, lists active listeners or pending futures, or reloads the config.
    usage: /sklambda [listeners|futures|reload]
    aliases: [skl]
    permission: sklambda.admin
    permission-message: You don't have permission to use this command.

permissions:
  sklambda.admin:
    description: Allows use of /sklambda.
    default: op
  sklambda.reload:
    description: Allows use of /sklambda reload.
    default: op
